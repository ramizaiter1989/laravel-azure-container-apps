name: CI / Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_VERSION="${{ github.sha }}" \
            ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080/up > /dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/api/info | tee /dev/stderr | grep -q "${{ github.sha }}"
          curl -fs -X POST http://localhost:8080/api/quotes \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"year":2014,"body_type":"sedan","condition":"running","mileage":90000}'

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write   # OIDC token for azure/login: no client secret stored anywhere
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure is configured
        id: configured
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::Azure secrets not set yet; run infra/bootstrap.ps1 once. Skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@v2
        if: steps.configured.outputs.ok == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        if: steps.configured.outputs.ok == 'true'
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "deploy-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters image="${{ needs.build.outputs.image }}" \
                         appVersion="${{ github.sha }}" \
                         appKey="$APP_KEY" \
            --query properties.outputs.url.value --output tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live revision
        if: steps.configured.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fs "${{ steps.deploy.outputs.url }}/api/info" | grep -q "${{ github.sha }}"; then
              echo "Live and serving ${{ github.sha }}"; exit 0
            fi
            sleep 10
          done
          echo "::error::New revision did not come up"; exit 1
